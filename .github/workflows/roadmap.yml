name: Refresh live ARS roadmap

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted, transferred]
  release:
    types: [published, edited, deleted]
  pull_request:
    paths:
      - README.md
      - tools/render_roadmap.py
      - tools/render_roadmap_hud.py
      - tools/test_roadmap_hud.py
      - tools/render_status_hud.py
      - tools/test_status_hud.py
      - tools/test_roadmap_workflow.py
      - docs/ROADMAP.md
      - docs/assets/roadmap.svg
      - docs/assets/roadmap-live.png
      - docs/assets/ars-roadmap-hud-base.png
      - docs/assets/status-live.svg
      - .github/workflows/roadmap.yml
  push:
    branches: [main]
    paths:
      - README.md
      - tools/render_roadmap.py
      - tools/render_roadmap_hud.py
      - tools/test_roadmap_hud.py
      - tools/render_status_hud.py
      - tools/test_status_hud.py
      - tools/test_roadmap_workflow.py
      - docs/ROADMAP.md
      - docs/assets/roadmap.svg
      - docs/assets/roadmap-live.png
      - docs/assets/ars-roadmap-hud-base.png
      - docs/assets/status-live.svg
      - .github/workflows/roadmap.yml
  schedule:
    - cron: "23 */6 * * *"

# Pull requests never receive a write-capable workflow token.
permissions:
  contents: read
  issues: read

concurrency:
  group: refresh-ars-roadmap
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deterministic image renderer
        run: python -m pip install "Pillow==13.0.0"
      - name: Test evidence and live status calculations
        run: |
          python tools/test_roadmap_hud.py
          python tools/test_status_hud.py
          python tools/test_roadmap_workflow.py
      - name: Render preview without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/render_roadmap.py
          python tools/render_roadmap_hud.py
          python tools/render_status_hud.py
      - name: Reject stale or tampered generated files
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- docs/ROADMAP.md docs/assets/roadmap.svg docs/assets/roadmap-live.png docs/assets/status-live.svg

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      # Release events check out a tag by default; always work from main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deterministic image renderer
        run: python -m pip install "Pillow==13.0.0"
      - name: Test evidence and live status calculations
        run: |
          python tools/test_roadmap_hud.py
          python tools/test_status_hud.py
          python tools/test_roadmap_workflow.py
      - name: Generate live roadmap graphics and accessible text
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tools/render_roadmap.py
          python tools/render_roadmap_hud.py
          python tools/render_status_hud.py
      - name: Commit updated roadmap only when it changed
        shell: bash
        run: |
          set -euo pipefail
          git add docs/assets/roadmap.svg docs/assets/roadmap-live.png docs/assets/status-live.svg docs/ROADMAP.md
          if git diff --cached --quiet; then
            echo "Roadmap content unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "docs(roadmap): refresh cinematic live status"
          git pull --rebase origin main
          git push origin HEAD:main

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
<title id="title">Advanced Realms Suite — Hall of Assimilated Heroes</title>
<desc id="desc">An illustrated dark bronze museum gallery showing framed tributes to Advanced Damage System by id577, Courseplay by the Courseplay Team, AutoDrive by Stephan-S and contributors, and Soil Work Yield Bonus by moji. Every exhibit is marked Reference, Not Replaced. This is a tribute to modding pioneers, not a claim that their mods have been replaced.</desc>
